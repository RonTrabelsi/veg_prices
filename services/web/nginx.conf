server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API container on every request: its IP changes whenever it is rebuilt.
    # (a literal hostname in proxy_pass is resolved once at startup and goes stale -> 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The analytics can take a few seconds on a cold cache, a full history load up to a minute
    location /api/ {
        set $api rest_scraper;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api:80;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Single page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
